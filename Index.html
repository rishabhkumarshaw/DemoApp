<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,.1);
        }

        h1 {
            color: #333;
        }

        input, button {
            padding: 10px;
            margin: 8px 0;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background: #0078D7;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #005fa3;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eef;
            border-radius: 5px;
            min-height: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>HTML Test Page</h1>

    <label>Name</label>
    <input type="text" id="txtName" placeholder="Enter your name">

    <button onclick="sayHello()">Click Me</button>

    <button onclick="loadData()">Call API</button>

    <div id="result">Output will appear here...</div>
</div>

<script>
    function sayHello() {
        const name = document.getElementById("txtName").value;

        document.getElementById("result").innerHTML =
            `<h3>Hello ${name || "Guest"}!</h3>`;
    }

    async function loadData() {
        try {
            const response = await fetch("https://jsonplaceholder.typicode.com/users");
            const data = await response.json();

            let html = "<h3>Users</h3><ul>";

            data.forEach(user => {
                html += `<li>${user.name}</li>`;
            });

            html += "</ul>";

            document.getElementById("result").innerHTML = html;
        }
        catch (err) {
            document.getElementById("result").innerHTML =
                "Error: " + err.message;
        }
    }
</script>

</body>
</html>
